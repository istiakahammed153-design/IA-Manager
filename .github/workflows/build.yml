name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare project
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "Project files found in repo root"
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            ZIP=$(ls *.zip 2>/dev/null | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "::error::No .zip file found in the repository root"
              exit 1
            fi
            SIZE=$(stat -c%s "$ZIP")
            echo "Using zip: $ZIP ($SIZE bytes)"
            if ! unzip -tq "$ZIP" > /dev/null 2>&1; then
              echo "::error::$ZIP is corrupted or incomplete ($SIZE bytes). Please download it again and re-upload."
              exit 1
            fi
            mkdir -p project
            unzip -q "$ZIP" -d project
            SETTINGS=$(find project -name settings.gradle.kts | head -n 1)
            echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Build release APK
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          gradle assembleRelease --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show errors summary
        if: failure()
        run: |
          {
            echo '### Build errors'
            echo '```'
            grep -E '^e: ' build.log | head -n 60 || true
            grep -A 8 'What went wrong' build.log | head -n 30 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full build log
        if: always() && hashFiles('build.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IAManager-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
